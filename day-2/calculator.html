<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Simple Calculator</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .calculator {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        width: 300px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      input,
      select,
      button {
        width: 100%;
        margin-bottom: 10px;
        padding: 8px;
      }

      p {
        font-weight: bold;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="calculator">
      <input type="number" id="num1" placeholder="Enter first number" />
      <input type="number" id="num2" placeholder="Enter second number" />

      <select id="operation">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">×</option>
        <option value="/">÷</option>
      </select>

      <button id="calcBtn">Calculate</button>

      <p id="result"></p>
    </div>

    <script>
      document.querySelector("#calcBtn").addEventListener("click", function () {
        const n1 = Number(document.querySelector("#num1").value);
        const n2 = Number(document.querySelector("#num2").value);
        const op = document.querySelector("#operation").value;

        let res;

        switch (op) {
          case "+":
            res = n1 + n2;
            break;
          case "-":
            res = n1 - n2;
            break;
          case "*":
            res = n1 * n2;
            break;
          case "/":
            if (n2 === 0) {
              alert("Division by zero is not allowed");
              return;
            }
            res = n1 / n2;
            break;
        }

        document.querySelector("#result").textContent =
          `${n1} ${op} ${n2} = ${res}`;
      });
    </script>
  </body>
</html>
